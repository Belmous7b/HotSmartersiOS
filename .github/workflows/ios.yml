name: iOS build

# Builds the app on a free macOS runner:
#  1. Compiles for the Simulator (catches every Swift error).
#  2. Takes a launch screenshot (best effort) so you can see the UI.
#  3. Builds an UNSIGNED device .ipa you can sign + install with Sideloadly on Windows.
#
# Run it from the repo's "Actions" tab (Run workflow) or on every push.

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

concurrency:
  group: ios-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select latest stable Xcode (needs Xcode 16 for this project)
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Xcode version
        run: xcodebuild -version

      # ---- 1. Compile for the Simulator (the real pass/fail check) ----
      - name: Build (iOS Simulator)
        run: |
          set -o pipefail
          xcodebuild \
            -project HotSmartersiOS.xcodeproj \
            -scheme HotSmartersiOS \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build

      # ---- 2. Launch it on a Simulator and grab a screenshot (optional) ----
      - name: Screenshot on Simulator
        continue-on-error: true
        run: |
          UDID=$(xcrun simctl list devices available | grep -m1 "iPhone" | grep -oE '[0-9A-F]{8}-([0-9A-F]{4}-){3}[0-9A-F]{12}')
          echo "Using simulator $UDID"
          xcrun simctl boot "$UDID" || true
          sleep 5
          APP=$(find build/Build/Products -name 'HotSmartersiOS.app' -path '*Simulator*' | head -1)
          echo "App: $APP"
          xcrun simctl install "$UDID" "$APP"
          xcrun simctl launch "$UDID" com.hotsmarters.player || true
          sleep 12
          xcrun simctl io "$UDID" screenshot screenshot.png

      - name: Upload screenshot
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: simulator-screenshot
          path: screenshot.png
          if-no-files-found: ignore

      # ---- 3. Build an UNSIGNED device app and package it as an .ipa ----
      - name: Build (unsigned device)
        run: |
          set -o pipefail
          xcodebuild \
            -project HotSmartersiOS.xcodeproj \
            -scheme HotSmartersiOS \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build-device \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package unsigned .ipa
        run: |
          APP=$(find build-device/Build/Products -name 'HotSmartersiOS.app' -path '*iphoneos*' | head -1)
          echo "Packaging $APP"
          rm -rf Payload HotSmartersiOS-unsigned.ipa
          mkdir Payload
          cp -R "$APP" Payload/
          zip -qr HotSmartersiOS-unsigned.ipa Payload
          ls -lh HotSmartersiOS-unsigned.ipa

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: HotSmartersiOS-unsigned-ipa
          path: HotSmartersiOS-unsigned.ipa
          if-no-files-found: error
